<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 飲食營養追蹤面板</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #2563eb;
      --carb: #f59e0b;
      --pro: #10b981;
      --fat: #ef4444;
      --text: #1e293b;
      --subtext: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
    }
    .container {
      max-width: 850px;
      margin: 0 auto;
      background: var(--card);
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    h2 { margin: 0 0 6px 0; font-size: 1.3rem; display: flex; align-items: center; gap: 8px; }
    .subtitle { color: var(--subtext); font-size: 0.85rem; margin-bottom: 14px; }
    .api-box {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 0.85rem;
    }
    .api-row { display: flex; gap: 8px; margin-top: 6px; }
    .api-row input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .upload-section {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 16px;
      background: #fafafa;
    }
    .preview-img {
      max-width: 100%;
      max-height: 250px;
      border-radius: 10px;
      display: none;
      margin: 10px auto;
      object-fit: contain;
      border: 1px solid #e2e8f0;
    }
    .prompt-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 0.95rem;
    }
    .action-btns { display: flex; gap: 10px; margin-top: 12px; }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-camera { background: #e0e7ff; color: #1e40af; flex: 1; }
    .btn-analyze { background: var(--primary); color: #fff; flex: 2; }
    .btn-sm { padding: 6px 12px; font-size: 0.85rem; }
    .status-msg {
      display: none;
      margin: 12px 0;
      padding: 10px 14px;
      border-radius: 8px;
      background: #eff6ff;
      color: #1e40af;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .ai-notes {
      display: none;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f0fdf4;
      border-left: 4px solid var(--pro);
      font-size: 0.88rem;
      line-height: 1.5;
    }
    .dashboard {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    @media (min-width: 600px) {
      .dashboard { grid-template-columns: repeat(4, 1fr); }
    }
    .stat-card {
      padding: 12px;
      border-radius: 10px;
      background: #f1f5f9;
      text-align: center;
      border-left: 4px solid var(--primary);
    }
    .stat-card.carb { border-left-color: var(--carb); }
    .stat-card.pro { border-left-color: var(--pro); }
    .stat-card.fat { border-left-color: var(--fat); }
    .stat-title { font-size: 0.8rem; color: var(--subtext); font-weight: 600; }
    .stat-value { font-size: 1.45rem; font-weight: 800; margin: 4px 0; }
    .stat-sub { font-size: 0.75rem; color: var(--subtext); }
    .macro-bar-wrap { margin-bottom: 14px; }
    .macro-bar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--subtext);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .macro-bar {
      height: 10px;
      width: 100%;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      display: flex;
    }
    .bar-c { background: var(--carb); transition: width 0.25s; }
    .bar-p { background: var(--pro); transition: width 0.25s; }
    .bar-f { background: var(--fat); transition: width 0.25s; }
    .
