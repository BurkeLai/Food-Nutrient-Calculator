<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 飲食營養追蹤面板</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --carb: #f59e0b;
      --pro: #10b981;
      --fat: #ef4444;
      --text: #1e293b;
      --subtext: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
    }
    .container {
      max-width: 850px;
      margin: 0 auto;
      background: var(--card);
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    h2 { margin: 0 0 6px 0; font-size: 1.35rem; display: flex; align-items: center; gap: 8px; }
    .subtitle { color: var(--subtext); font-size: 0.85rem; margin-bottom: 16px; }

    /* API 設定區 */
    .api-box {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.85rem;
    }
    .api-row { display: flex; gap: 8px; margin-top: 6px; }
    .api-row input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    /* 拍照與辨識區 */
    .upload-section {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 18px;
      background: #fafafa;
    }
    .preview-img {
      max-width: 100%;
      max-height: 240px;
      border-radius: 10px;
      display: none;
      margin: 10px auto;
      object-fit: cover;
    }
    .prompt-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 0.95rem;
    }
    .action-btns {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-camera { background: #e0e7ff; color: #1e40af; flex: 1; }
    .btn-analyze { background: var(--primary); color: #fff; flex: 2; }
    .btn-sm { padding: 7px 12px; font-size: 0.85rem; }

    /* 載入動畫與解析提示 */
    .status-msg {
      display: none;
      margin: 12px 0;
      padding: 10px 14px;
      border-radius: 8px;
      background: #eff6ff;
      color: #1e40af;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .ai-notes {
      display: none;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f0fdf4;
      border-left: 4px solid var(--pro);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    /* 儀表板 */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    @media (min-width: 600px) {
      .dashboard { grid-template-columns: repeat(4, 1fr); }
    }
    .stat-card {
      padding: 12px;
      border-radius: 10px;
      background: #f1f5f9;
      text-align: center;
      border-left: 4px solid var(--primary);
    }
    .stat-card.carb { border-left-color: var(--carb); }
    .stat-card.pro { border-left-color: var(--pro); }
    .stat-card.fat { border-left-color: var(--fat); }
    .stat-title { font-size: 0.8rem; color: var(--subtext); font-weight: 600; }
    .stat-value { font-size: 1.45rem; font-weight: 800; margin: 4px 0; }
    .stat-sub { font-size: 0.75rem; color: var(--subtext); }

    /* 比例條 */
    .macro-bar-wrap { margin-bottom: 16px; }
    .macro-bar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--subtext);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .macro-bar {
      height: 10px;
      width: 100%;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      display: flex;
    }
    .bar-c { background: var(--carb); transition: width 0.25s; }
    .bar-p { background: var(--pro); transition: width 0.25s; }
    .bar-f { background: var(--fat); transition: width 0.25s; }

    /* 連動開關 */
    .sync-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      background: #eff6ff;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
    }

    /* 表格 */
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 14px; min-width: 540px; }
    th, td { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: left; }
    th { background: #f8fafc; font-size: 0.8rem; color: var(--subtext); white-space: nowrap; }
    td input[type="text"] {
      width: 100%;
      min-width: 110px;
      padding: 6px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    td input[type="number"] {
      width: 64px;
      padding: 6px 4px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      text-align: right;
      font-size: 0.9rem;
      font-family: monospace;
    }
    .kcal-cell { font-weight: 700; color: var(--primary); font-family: monospace; white-space: nowrap; }
    .btn-del { background: #fee2e2; color: #dc2626; padding: 5px 8px; font-size: 0.78rem; border-radius: 6px; }
  </style>
</head>
<body>

<div class="container">
  <h2>📸 AI 識食與營養計算機</h2>
  <div class="subtitle">拍照上傳自動拆解台灣外食份量，並支援手動即時微調</div>

  <!-- Gemini API Key 設定 -->
  <div class="api-box">
    <div>🔑 <strong>Gemini API Key 設定</strong>（僅儲存於您的手機瀏覽器中）</div>
    <div class="api-row">
      <input type="password" id="api-key-input" placeholder="貼上您的 Gemini API Key (AIzaSy...)">
      <button class="btn btn-sm" style="background:#334155;color:#fff;" onclick="saveApiKey()">儲存</button>
    </div>
  </div>

  <!-- 拍照與上傳區塊 -->
  <div class="upload-section">
    <input type="file" id="image-input" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
    <img id="preview" class="preview-img" alt="餐點預覽">
    <input type="text" id="user-note" class="prompt-input" placeholder="選填備註：例如「飯只吃一半」、「雞腿去皮」、「水餃10顆」...">
    <div class="action-btns">
      <button class="btn btn-camera" onclick="document.getElementById('image-input').click()">📷 拍照 / 選照片</button>
      <button class="btn btn-analyze" id="analyze-btn" onclick="analyzeFoodWithGemini()">✨ 交給 Gemini 辨識</button>
    </div>
    <div id="status-msg" class="status-msg">⏳ Gemini 正在分析餐點組成與重量，請稍候...</div>
  </div>

  <!-- AI 營養師建議與納含量提示 -->
  <div id="ai-notes" class="ai-notes"></div>

  <!-- 頂部統計儀表板 -->
  <div class="dashboard">
    <div class="stat-card">
      <div class="stat-title">總熱量</div>
      <div class="stat-value" id="tot-kcal">0</div>
      <div class="stat-sub">kcal ｜ 總重 <span id="tot-weight">0</span>g</div>
    </div>
    <div class="stat-card carb">
      <div class="stat-title">碳水化合物</div>
      <div class="stat-value" id="tot-carb">0g</div>
      <div class="stat-sub" id="pct-carb">0%</div>
    </div>
    <div class="stat-card pro">
      <div class="stat-title">蛋白質</div>
      <div class="stat-value" id="tot-pro">0g</div>
      <div class="stat-sub" id="pct-pro">0%</div>
    </div>
    <div class="stat-card fat">
      <div class="stat-title">脂肪</div>
      <div class="stat-value" id="tot-fat">0g</div>
      <div class="stat-sub" id="pct-fat">0%</div>
    </div>
  </div>

  <!-- 比例條 -->
  <div class="macro-bar-wrap">
    <div class="macro-bar-labels">
      <span>🟡 碳水 (4 kcal/g)</span>
      <span>🟢 蛋白質 (4 kcal/g)</span>
      <span>🔴 脂肪 (9 kcal/g)</span>
    </div>
    <div class="macro-bar">
      <div id="bar-c" class="bar-c" style="width: 33%"></div>
      <div id="bar-p" class="bar-p" style="width: 33%"></div>
      <div id="bar-f" class="bar-f" style="width: 34%"></div>
    </div>
  </div>

  <label class="sync-toggle">
    <input type="checkbox" id="scale-with-weight" checked>
    <span><strong>修改「重量」時自動按比例縮放三大營養素</strong></span>
  </label>

  <!-- 互動式表格 -->
  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th style="width:30%">食材名稱</th>
          <th>重量(g)</th>
          <th>碳水(g)</th>
          <th>蛋白(g)</th>
          <th>脂肪(g)</th>
          <th>熱量</th>
          <th>刪除</th>
        </tr>
      </thead>
      <tbody id="food-tbody"></tbody>
    </table>
  </div>

  <div style="display:flex; gap:10px;">
    <button class="btn btn-sm" style="background:var(--primary);color:#fff;" onclick="addNewRow()">＋ 手動新增食材</button>
    <button class="btn btn-sm" style="background:#e2e8f0;color:#334155;" onclick="clearAllRows()">清空表格</button>
  </div>
</div>

<script>
  let currentBase64Image = "";
  let currentMimeType = "image/jpeg";
  let foods = [
    { name: "範例：醬炒雞胸肉", weight: 170, carb: 4.5, pro: 42.0, fat: 6.0 },
    { name: "範例：紫米飯", weight: 190, carb: 58.0, pro: 5.5, fat: 1.5 },
    { name: "範例：炒青江菜", weight: 75, carb: 4.0, pro: 1.8, fat: 2.5 }
  ];

  // 初始化載入 API Key 與預設表格
  window.onload = () => {
    const savedKey = localStorage.getItem("gemini_food_api_key");
    if (savedKey) document.getElementById("api-key-input").value = savedKey;
    renderTable();
  };

  function saveApiKey() {
    const key = document.getElementById("api-key-input").value.trim();
    if (!key) return alert("請輸入有效的 API Key");
    localStorage.setItem("gemini_food_api_key", key);
    alert("✅ API Key 已儲存於瀏覽器！");
  }

  // 處理圖片選取與壓縮轉 Base64
  function handleImageSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    currentMimeType = file.type || "image/jpeg";

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = document.getElementById("preview");
      img.src = e.target.result;
      img.style.display = "block";
      // 壓縮圖片避免手機照片過大導致請求過慢
      compressImage(e.target.result, 1024, (base64) => {
        currentBase64Image = base64.split(",")[1];
      });
    };
    reader.readAsDataURL(file);
  }

  function compressImage(dataUrl, maxWidth, callback) {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL("image/jpeg", 0.82));
    };
    img.src = dataUrl;
  }

  // 呼叫 Gemini API 進行結構化食物辨識
  async function analyzeFoodWithGemini() {
    const apiKey = localStorage.getItem("gemini_food_api_key") || document.getElementById("api-key-input").value.trim();
    if (!apiKey) return alert("請先在上方輸入並儲存您的 Gemini API Key！");

    const note = document.getElementById("user-note").value.trim();
    if (!currentBase64Image && !note) {
      return alert("請先拍張食物照片，或在備註欄輸入您吃了什麼！");
    }

    const statusEl = document.getElementById("status-msg");
    const analyzeBtn = document.getElementById("analyze-btn");
    statusEl.style.display = "block";
    analyzeBtn.disabled = true;

    const systemPrompt = `你是一位精通台灣小吃、便當與餐廳份量的專業營養師。
請根據使用者提供的餐點照片與備註，將整份餐點拆解為個別食材組成（包含隱藏烹調用油、淋汁或醬料）。
請嚴格只回傳 JSON 格式，結構如下：
{
  "items": [
    { "name": "食材名稱", "weight": 估計克數(數字), "carb": 碳水克數(數字), "pro": 蛋白質克數(數字), "fat": 脂肪克數(數字) }
  ],
  "sodium_mg": "預估總鈉含量範圍(如 900~1200 mg)",
  "advice": "1~2句簡短精準的飲食調整建議（例如去皮或少喝湯可省下多少熱量）"
}`;

    const parts = [{ text: systemPrompt + (note ? `\n使用者額外備註：${note}` : "") }];
    if (currentBase64Image) {
      parts.push({
        inline_data: { mime_type: "image/jpeg", data: currentBase64Image }
      });
    }

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: parts }],
          generationConfig: { responseMimeType: "application/json" }
        })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      const rawText = data.candidates[0].content.parts[0].text;
      const result = JSON.parse(rawText);

      if (result.items && Array.isArray(result.items)) {
        foods = result.items;
        renderTable();
      }

      const notesEl = document.getElementById("ai-notes");
      notesEl.style.display = "block";
      notesEl.innerHTML = `<strong>💡 AI 營養解析：</strong>預估鈉含量約 <b>${result.sodium_mg || "未提供"}</b>。<br>${result.advice || ""}`;
    } catch (err) {
      alert("辨識失敗，請檢查 API Key 或網路連線：\n" + err.message);
    } finally {
      statusEl.style.display = "none";
      analyzeBtn.disabled = false;
    }
  }

  function calcItemKcal(c, p, f) {
    return (c * 4) + (p * 4) + (f * 9);
  }

  function renderTable() {
    const tbody = document.getElementById("food-tbody");
    tbody.innerHTML = "";
    foods.forEach((item, index) => {
      const kcal = Math.round(calcItemKcal(item.carb, item.pro, item.fat));
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><input type="text" value="${item.name}" oninput="foods[${index}].name = this.value"></td>
        <td><input type="number" step="1" min="0" value="${item.weight}" oninput="updateWeight(${index}, this.value)"></td>
        <td><input type="number" step="0.5" min="0" id="carb-${index}" value="${item.carb}" oninput="updateMacro(${index}, 'carb', this.value)"></td>
        <td><input type="number" step="0.5" min="0" id="pro-${index}" value="${item.pro}" oninput="updateMacro(${index}, 'pro', this.value)"></td>
        <td><input type="number" step="0.5" min="0" id="fat-${index}" value="${item.fat}" oninput="updateMacro(${index}, 'fat', this.value)"></td>
        <td class="kcal-cell" id="kcal-${index}">${kcal} kcal</td>
        <td><button class="btn btn-del" onclick="removeRow(${index})">✕</button></td>
      `;
      tbody.appendChild(tr);
    });
    updateSummary();
  }

  function updateWeight(index, val) {
    const newWeight = parseFloat(val) || 0;
    const oldWeight = foods[index].weight;
    const isSync = document.getElementById("scale-with-weight").checked;

    if (isSync && oldWeight > 0) {
      const ratio = newWeight / oldWeight;
      foods[index].carb = Math.round(foods[index].carb * ratio * 10) / 10;
      foods[index].pro  = Math.round(foods[index].pro * ratio * 10) / 10;
      foods[index].fat  = Math.round(foods[index].fat * ratio * 10) / 10;
      document.getElementById(`carb-${index}`).value = foods[index].carb;
      document.getElementById(`pro-${index}`).value  = foods[index].pro;
      document.getElementById(`fat-${index}`).value  = foods[index].fat;
    }
    foods[index].weight = newWeight;
    refreshRowAndTotal(index);
  }

  function updateMacro(index, key, val) {
    foods[index][key] = parseFloat(val) || 0;
    refreshRowAndTotal(index);
  }

  function refreshRowAndTotal(index) {
    const item = foods[index];
    const kcal = Math.round(calcItemKcal(item.carb, item.pro, item.fat));
    document.getElementById(`kcal-${index}`).innerText = `${kcal} kcal`;
    updateSummary();
  }

  function updateSummary() {
    let totWeight = 0, totCarb = 0, totPro = 0, totFat = 0;
    foods.forEach(item => {
      totWeight += Number(item.weight) || 0;
      totCarb   += Number(item.carb) || 0;
      totPro    += Number(item.pro) || 0;
      totFat    += Number(item.fat) || 0;
    });

    const totKcal = calcItemKcal(totCarb, totPro, totFat);
    document.getElementById("tot-weight").innerText = Math.round(totWeight);
    document.getElementById("tot-kcal").innerText   = Math.round(totKcal);
    document.getElementById("tot-carb").innerText   = `${totCarb.toFixed(1)}g`;
    document.getElementById("tot-pro").innerText    = `${totPro.toFixed(1)}g`;
    document.getElementById("tot-fat").innerText    = `${totFat.toFixed(1)}g`;

    const cKcal = totCarb * 4, pKcal = totPro * 4, fKcal = totFat * 9;
    const cPct = totKcal > 0 ? Math.round((cKcal / totKcal) * 100) : 0;
    const pPct = totKcal > 0 ? Math.round((pKcal / totKcal) * 100) : 0;
    const fPct = totKcal > 0 ? Math.max(0, 100 - cPct - pPct) : 0;

    document.getElementById("pct-carb").innerText = `${cPct}% (${Math.round(cKcal)} kcal)`;
    document.getElementById("pct-pro").innerText  = `${pPct}% (${Math.round(pKcal)} kcal)`;
    document.getElementById("pct-fat").innerText  = `${fPct}% (${Math.round(fKcal)} kcal)`;

    document.getElementById("bar-c").style.width = `${cPct}%`;
    document.getElementById("bar-p").style.width = `${pPct}%`;
    document.getElementById("bar-f").style.width = `${fPct}%`;
  }

  function addNewRow() {
    foods.push({ name: "新食材", weight: 100, carb: 10, pro: 10, fat: 5 });
    renderTable();
  }

  function removeRow(index) {
    foods.splice(index, 1);
    renderTable();
  }

  function clearAllRows() {
    foods = [];
    renderTable();
  }
</script>

</body>
</html>
